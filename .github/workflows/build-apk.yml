name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter & System Environment
        run: |
          flutter --version
          java -version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify Built APK Output
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CineCut-Pro-Release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCut-Pro-Release-APK
          path: build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.2.0
          name: "CineCut Pro v1.2.0 - Latest Standalone Android APK"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎬 CineCut Pro Studio Android APK (Latest v1.2.0)

            Latest standalone production Android APK for CineCut Studio. Built with embedded offline local runtime — zero cloud URL dependencies, no 404s, works offline and connects to real-time Firebase backend.

            ### ✨ Core Features:
            - 🚪 **Account Logout & Authentication**: Dedicated Logout option in Navbar & Profile with confirmation modal.
            - 🎬 **Multi-Track Video Editing Studio**: Timeline trimming, split, merge, audio tracks, 15+ LUTs & visual filters.
            - 📺 **Live TV Broadcaster & Viewer**: 4K live streams and realtime chat synchronized with Firestore.
            - 👥 **CineRooms**: Real-time collaborative workspace with room codes.
            - 💎 **7-Day Free Trial & Subscription Plans**: Pre-activated trial, VIP/Diamond/Founder passes.
            - 💳 **UPI Payment & UTR Processing**: Direct instant payment and verification.
            - 🛡️ **Admin Center**: Real-time User Management, live TV management, and ad system.

            ### 📲 Direct Installation:
            Download `CineCut-Pro-Release.apk` below and install directly on Android.
          files: |
            build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
