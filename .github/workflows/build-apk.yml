name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify Built APK Output
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CineCut-Pro-Release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCut-Pro-Release-APK
          path: build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.1.0
          name: "CineCut Pro v1.1.0 - Latest Android APK"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎬 CineCut Pro Studio Android APK (Latest v1.1.0)

            Latest official production Android APK for CineCut Studio. Built directly from our latest release.

            ### ✨ Features Included:
            - 🎬 **Multi-Track Video Editing Studio**: Timeline trimming, split, merge, 15+ LUTs & visual filters.
            - 📺 **Live TV Broadcaster & Viewer**: 4K live streams and realtime chat synced with Firestore.
            - 💎 **7-Day Free Trial & Default Free Plan**: Pre-activated on accounts.
            - 💳 **UPI Payment & UTR Processing**: Direct instant payment and verification.
            - 🛡️ **Admin Center**: Realtime User Management, live TV management, and coin dispatch.
            - 🚪 **Account Logout & Device Session Control**: Secure authentication switcher.

            ### 📲 Direct Download:
            Click below to download `CineCut-Pro-Release.apk` and install directly on Android.
          files: |
            build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
