name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Verify Flutter & System Environment
        run: |
          flutter --version
          java -version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify Built APK Output
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CineCut-Pro-Release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineCut-Pro-Release-APK
          path: build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.3.0
          name: "CineCut Pro v1.3.0 - High Performance Android APK (60FPS & Fixed Google Auth)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎬 CineCut Pro Studio Android APK (Latest v1.3.0)

            High-performance, lag-free Android APK for CineCut Studio. Built with hardware-accelerated rendering (60FPS), large memory heap, embedded offline local runtime, and fixed Google Authentication.

            ### 🚀 What's New in v1.3.0:
            - ⚡ **Silky-Smooth 60FPS Performance**: Eliminated heavy Gaussian blur and continuous GPU animations. Added hardware acceleration and large memory heap (`largeHeap=true`) for fluid video timeline editing and canvas playback.
            - 🔑 **Fixed Google Authentication**: Solved embedded WebView 400 "Request sent is invalid" error. Seamless in-app Google Account Picker with 1-Tap Robin (Founder & Super Admin) login and custom @gmail.com support.
            - 🚀 **1-Tap Guest / Tester Pass**: Free 7-Day instant VIP access for easy sharing with friends on Android phones (no signup needed).
            - 📲 **Native Share & APK Download**: In-app "Share App" modal with direct link copying and native Android system share sheet.
            - 🚪 **Account Logout**: Dedicated logout actions in Navbar and Profile with confirmation dialog.
            - 🎬 **Multi-Track Video Studio**: 4K timeline, trim, split, merge, 15+ LUTs, and audio tracks.
            - 📺 **CineLive TV & CineRooms**: Real-time collaborative workspace and 4K broadcasts.

            ### 📲 Direct Installation:
            Download `CineCut-Pro-Release.apk` below and install directly on any Android device.
          files: |
            build/app/outputs/flutter-apk/CineCut-Pro-Release.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
