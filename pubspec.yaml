name: cinecut
description: "CineCut - Professional Video Editor with AI Director, Firebase, and CineLive"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  cloud_functions: ^5.2.0
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2
  
  # Media & Video
  video_player: ^2.9.2
  chewie: ^1.8.5
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  
  # State & Architecture
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/coins/
